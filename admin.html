<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Coin — Admin Portal</title>
    <!-- ... (keep your styles) ... -->
</head>
<body>
    <!-- ... (keep your HTML structure) ... -->

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ================================================================
        // 🔥 FIREBASE CONFIG (same as before)
        // ================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // 👑 ADMIN CHECK
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Check if user is admin
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            if (!adminDoc.exists) {
                showToast('⛔ Access denied. Admins only.', 'error');
                await auth.signOut();
                window.location.href = 'login.html';
                return;
            }

            // Load all data
            await loadUsers();
            await loadWallets();
            await loadGames();
            await updateStats();
        });

        // ================================================================
        // 📊 LOAD USERS
        // ================================================================
        async function loadUsers() {
            try {
                const snapshot = await db.collection('users')
                    .orderBy('createdAt', 'desc')
                    .get();

                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                snapshot.forEach(doc => {
                    const user = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${user.firstName} ${user.lastName}</strong></td>
                        <td>${user.email}</td>
                        <td><span class="status-badge ${user.status}">${user.status}</span></td>
                        <td>
                            <div class="table-actions">
                                <button class="btn btn-primary btn-sm view-user" data-id="${doc.id}"><i class="fas fa-eye"></i></button>
                                ${user.status === 'pending' ? `
                                    <button class="btn btn-success btn-sm approve-user" data-id="${doc.id}"><i class="fas fa-check"></i></button>
                                    <button class="btn btn-danger btn-sm reject-user" data-id="${doc.id}"><i class="fas fa-times"></i></button>
                                ` : ''}
                                ${user.status === 'approved' ? `
                                    <button class="btn btn-danger btn-sm suspend-user" data-id="${doc.id}"><i class="fas fa-ban"></i></button>
                                ` : ''}
                                ${user.status === 'suspended' ? `
                                    <button class="btn btn-success btn-sm restore-user" data-id="${doc.id}"><i class="fas fa-undo"></i></button>
                                ` : ''}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Add event listeners
                document.querySelectorAll('.approve-user').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.id;
                        await db.collection('users').doc(id).update({ status: 'approved' });
                        showToast('✅ User approved!', 'success');
                        await loadUsers();
                    });
                });

                document.querySelectorAll('.reject-user').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.id;
                        await db.collection('users').doc(id).update({ status: 'rejected' });
                        showToast('❌ User rejected.', 'error');
                        await loadUsers();
                    });
                });

                document.querySelectorAll('.suspend-user').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.id;
                        await db.collection('users').doc(id).update({ status: 'suspended' });
                        showToast('⚠️ User suspended.', 'info');
                        await loadUsers();
                    });
                });

                document.querySelectorAll('.restore-user').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.id;
                        await db.collection('users').doc(id).update({ status: 'approved' });
                        showToast('✅ User restored.', 'success');
                        await loadUsers();
                    });
                });

            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // ================================================================
        // 💰 LOAD WALLETS
        // ================================================================
        async function loadWallets() {
            try {
                const snapshot = await db.collection('wallets')
                    .orderBy('balance', 'desc')
                    .limit(10)
                    .get();

                const tbody = document.getElementById('walletTableBody');
                tbody.innerHTML = '';

                // Get user names
                for (const doc of snapshot.docs) {
                    const wallet = doc.data();
                    const userDoc = await db.collection('users').doc(wallet.userId).get();
                    const userData = userDoc.data();
                    
                    const tr = document.createElement('tr');
                    const balance = wallet.balance || 0;
                    const status = balance > 10000 ? 'High Activity' : balance > 5000 ? 'Suspicious' : 'Normal';
                    const statusColor = status === 'Normal' ? 'var(--green)' : status === 'Suspicious' ? 'var(--gold)' : 'var(--orange)';
                    
                    tr.innerHTML = `
                        <td><strong>${userData?.firstName || 'Unknown'} ${userData?.lastName || ''}</strong></td>
                        <td style="font-family:'Orbitron',monospace;">${balance.toLocaleString()} DAY</td>
                        <td><span style="color:${statusColor};">●</span> ${status}</td>
                        <td style="font-size:1.2rem;">${status === 'Normal' ? '✅' : '⚠️'}</td>
                    `;
                    tbody.appendChild(tr);
                }
            } catch (error) {
                console.error('Error loading wallets:', error);
            }
        }

        // ================================================================
        // 🎮 LOAD GAMES (Admin)
        // ================================================================
        async function loadGames() {
            try {
                const snapshot = await db.collection('games')
                    .orderBy('createdAt', 'desc')
                    .get();

                const grid = document.getElementById('gameManageGrid');
                grid.innerHTML = '';

                snapshot.forEach(doc => {
                    const game = doc.data();
                    const div = document.createElement('div');
                    div.className = 'game-manage-item';
                    div.innerHTML = `
                        <div class="g-info">
                            <span class="g-name"><i class="fas fa-gamepad" style="color:var(--cyan);"></i> ${game.name}</span>
                            <span class="g-meta">Prize: ${game.prize} DAY • <span class="status-badge ${game.status}">${game.status}</span></span>
                        </div>
                        <div class="g-controls">
                            <select class="game-status-select" data-id="${doc.id}" style="background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:6px;color:#fff;padding:4px 8px;font-size:0.7rem;outline:none;">
                                <option value="live" ${game.status === 'live' ? 'selected' : ''}>Live</option>
                                <option value="upcoming" ${game.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
                                <option value="ended" ${game.status === 'ended' ? 'selected' : ''}>Ended</option>
                            </select>
                            <button class="btn btn-danger btn-sm delete-game" data-id="${doc.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    grid.appendChild(div);
                });

                // Add event listeners
                document.querySelectorAll('.game-status-select').forEach(select => {
                    select.addEventListener('change', async function() {
                        const id = this.dataset.id;
                        await db.collection('games').doc(id).update({
                            status: this.value
                        });
                        showToast('✅ Game status updated!', 'success');
                        await loadGames();
                    });
                });

                document.querySelectorAll('.delete-game').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.id;
                        if (confirm('Delete this game?')) {
                            await db.collection('games').doc(id).delete();
                            showToast('🗑️ Game deleted.', 'info');
                            await loadGames();
                        }
                    });
                });

            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        // ================================================================
        // 📊 UPDATE STATS
        // ================================================================
        async function updateStats() {
            try {
                const usersSnap = await db.collection('users').get();
                const walletsSnap = await db.collection('wallets').get();
                const gamesSnap = await db.collection('games').where('status', '==', 'live').get();

                let totalBalance = 0;
                walletsSnap.forEach(doc => {
                    totalBalance += doc.data().balance || 0;
                });

                // Update stat cards
                document.querySelector('.stat-number').textContent = usersSnap.size.toLocaleString();
                const statNumbers = document.querySelectorAll('.stat-number');
                if (statNumbers.length > 1) {
                    statNumbers[1].textContent = '$' + (totalBalance * 2.47).toFixed(1) + 'K';
                }
                if (statNumbers.length > 2) {
                    statNumbers[2].textContent = gamesSnap.size;
                }

                // Update pending users count
                const pendingSnap = await db.collection('users').where('status', '==', 'pending').get();
                document.querySelector('.badge.warning').textContent = `${pendingSnap.size} pending`;

                // Update live games
                await renderLiveGames();
                
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        // ================================================================
        // 🎮 RENDER LIVE GAMES
        // ================================================================
        async function renderLiveGames() {
            try {
                const snapshot = await db.collection('games')
                    .where('status', '==', 'live')
                    .orderBy('createdAt', 'desc')
                    .get();

                const container = document.getElementById('liveGamesList');
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div style="padding:20px; text-align:center; color:var(--text-muted);">
                            <i class="fas fa-gamepad" style="font-size:2rem; opacity:0.3;"></i>
                            <p style="margin-top:8px;">No live games at the moment.</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach(doc => {
                    const game = doc.data();
                    const div = document.createElement('div');
                    div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border-glass);';
                    div.innerHTML = `
                        <div>
                            <strong style="display:flex; align-items:center; gap:8px;">
                                <i class="fas fa-circle" style="color:var(--green); font-size:0.5rem;"></i>
                                ${game.name}
                            </strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">
                                ${game.players || 0} players • Prize: ${game.prize} DAY
                            </div>
                        </div>
                        <span style="font-size:0.7rem; color:var(--green); background:rgba(0,255,135,0.1); padding:2px 12px; border-radius:100px;">
                            LIVE
                        </span>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading live games:', error);
            }
        }

        // ================================================================
        // 🆕 ADD GAME
        // ================================================================
        document.getElementById('addGameBtn').addEventListener('click', async function() {
            const name = document.getElementById('newGameName').value.trim();
            const prize = parseInt(document.getElementById('newGamePrize').value);
            const status = document.getElementById('newGameStatus').value;

            if (!name || !prize) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            try {
                await db.collection('games').add({
                    name: name,
                    prize: prize,
                    status: status,
                    players: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('newGameName').value = '';
                document.getElementById('newGamePrize').value = '';
                showToast(`🎮 ${name} added successfully!`, 'success');
                await loadGames();
                await updateStats();
            } catch (error) {
                console.error('Error adding game:', error);
                showToast('Failed to add game.', 'error');
            }
        });

        // ================================================================
        // 💰 UPDATE DAY COIN PRICE
        // ================================================================
        document.getElementById('updatePriceBtn').addEventListener('click', async function() {
            const newPrice = parseFloat(document.getElementById('dayPriceInput').value);
            if (!newPrice || newPrice <= 0) {
                showToast('Please enter a valid price.', 'error');
                return;
            }

            try {
                await db.collection('settings').doc('daycoin_price').set({
                    price: newPrice,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                document.getElementById('dayPriceDisplay').textContent = '$' + newPrice.toFixed(2);
                showToast(`💰 Price updated to $${newPrice.toFixed(2)}`, 'success');
            } catch (error) {
                console.error('Error updating price:', error);
                showToast('Failed to update price.', 'error');
            }
        });

        // ================================================================
        // 🔄 LOAD PRICE ON START
        // ================================================================
        async function loadPrice() {
            try {
                const doc = await db.collection('settings').doc('daycoin_price').get();
                if (doc.exists) {
                    const price = doc.data().price;
                    document.getElementById('dayPriceDisplay').textContent = '$' + price.toFixed(2);
                    document.getElementById('dayPriceInput').value = price;
                }
            } catch (error) {
                console.error('Error loading price:', error);
            }
        }

        loadPrice();

        console.log('👑 Firebase Admin Portal loaded successfully!');
    </script>
</body>
</html>
