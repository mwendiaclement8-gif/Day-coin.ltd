<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Coin — Login / Register</title>
    <!-- Google Fonts & Font Awesome (same as before) -->
    <style>
        /* ... (keep your existing styles) ... */
    </style>
</head>
<body>
    <!-- ... (keep your existing HTML structure) ... -->

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ================================================================
        // 🔥 FIREBASE CONFIGURATION - REPLACE WITH YOUR OWN
        // ================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // 📝 REGISTRATION
        // ================================================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const fileInput = document.getElementById('idFile');

            if (!firstName || !lastName || !phone || !email || !username || !password) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }

            if (!fileInput.files || fileInput.files.length === 0) {
                showToast('Please upload a valid ID document.', 'error');
                return;
            }

            try {
                // 1. Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. Save user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    phone: phone,
                    email: email,
                    username: username,
                    walletBalance: 0,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    uid: user.uid
                });

                // 3. Create wallet document
                await db.collection('wallets').doc(user.uid).set({
                    balance: 0,
                    transactions: [],
                    status: 'Normal',
                    userId: user.uid
                });

                showToast('🎉 Account created! Please login.', 'success');
                setTimeout(() => {
                    switchForm('login');
                    document.getElementById('loginUsername').value = username;
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                showToast(error.message, 'error');
            }
        });

        // ================================================================
        // 🔐 LOGIN
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            try {
                // First, find user by username to get email
                const usersRef = db.collection('users');
                const snapshot = await usersRef.where('username', '==', username).get();

                if (snapshot.empty) {
                    showToast('User not found. Please check your username.', 'error');
                    return;
                }

                const userDoc = snapshot.docs[0];
                const userData = userDoc.data();
                const email = userData.email;

                // Sign in with email and password
                await auth.signInWithEmailAndPassword(email, password);
                
                // Check if user is approved
                if (userData.status === 'pending') {
                    showToast('⏳ Your account is pending admin approval.', 'info');
                    await auth.signOut();
                    return;
                }

                if (userData.status === 'suspended') {
                    showToast('🚫 Your account has been suspended. Contact admin.', 'error');
                    await auth.signOut();
                    return;
                }

                showToast('✅ Login successful! Redirecting...', 'success');
                
                // Store user data in session
                sessionStorage.setItem('userData', JSON.stringify({
                    uid: userDoc.id,
                    username: userData.username,
                    firstName: userData.firstName,
                    lastName: userData.lastName,
                    email: userData.email
                }));

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                showToast(error.message, 'error');
            }
        });

        // ================================================================
        // 🔑 GOOGLE SIGN-IN
        // ================================================================
        document.querySelectorAll('.btn-gmail').forEach(btn => {
            btn.addEventListener('click', async function() {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const user = result.user;

                    // Check if user exists in Firestore
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        // Create new user profile
                        await db.collection('users').doc(user.uid).set({
                            firstName: user.displayName?.split(' ')[0] || 'Google',
                            lastName: user.displayName?.split(' ')[1] || 'User',
                            phone: user.phoneNumber || '',
                            email: user.email,
                            username: user.displayName?.toLowerCase().replace(/\s/g, '') || 'google_user',
                            walletBalance: 0,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            uid: user.uid
                        });

                        await db.collection('wallets').doc(user.uid).set({
                            balance: 0,
                            transactions: [],
                            status: 'Normal',
                            userId: user.uid
                        });

                        showToast('🎉 Google account linked! Please wait for approval.', 'success');
                        await auth.signOut();
                    } else {
                        const data = userDoc.data();
                        if (data.status === 'pending') {
                            showToast('⏳ Your account is pending admin approval.', 'info');
                            await auth.signOut();
                            return;
                        }
                        if (data.status === 'suspended') {
                            showToast('🚫 Your account has been suspended.', 'error');
                            await auth.signOut();
                            return;
                        }
                        showToast('✅ Welcome back!', 'success');
                        sessionStorage.setItem('userData', JSON.stringify({
                            uid: user.uid,
                            username: data.username,
                            firstName: data.firstName,
                            lastName: data.lastName,
                            email: data.email
                        }));
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    }
                } catch (error) {
                    console.error('Google sign-in error:', error);
                    showToast(error.message, 'error');
                }
            });
        });

        // ================================================================
        // 📊 AUTH STATE LISTENER
        // ================================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('User is signed in:', user.uid);
            }
        });

        console.log('🔥 Firebase integrated successfully!');
    </script>
</body>
</html>
