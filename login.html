    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Coin — Login / Register</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-primary: #0a0b1a;
            --bg-secondary: #111328;
            --bg-card: rgba(17, 19, 40, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.08);

            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.15);
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.15);
            --purple: #7b2ffc;
            --purple-dim: rgba(123, 47, 252, 0.20);
            --pink: #ff2d95;
            --green: #00ff87;
            --red: #ff4757;

            --text-primary: #f0f4ff;
            --text-secondary: rgba(240, 244, 255, 0.7);
            --text-muted: rgba(240, 244, 255, 0.4);

            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 60px rgba(0, 240, 255, 0.08);

            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--cyan-dim);
        }

        /* ===== BACKGROUND PARTICLES ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 300px 300px;
        }

        /* ===== AUTH CONTAINER ===== */
        .auth-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: var(--shadow), var(--shadow-glow);
            animation: slide-up 0.6s ease forwards;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 30px var(--cyan-dim);
            }
            50% {
                box-shadow: 0 0 60px var(--cyan-dim), 0 0 90px rgba(0, 240, 255, 0.05);
            }
        }

        /* ===== AUTH HEADER ===== */
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 6px;
        }
        .auth-brand .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 0 30px var(--cyan-dim);
        }
        .auth-brand span {
            background: linear-gradient(135deg, var(--cyan), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-glass);
            padding: 4px;
            border-radius: 100px;
            border: 1px solid var(--border-glass);
            margin-top: 16px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-tab.active {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            box-shadow: 0 0 30px var(--cyan-dim);
        }
        .auth-tab:hover:not(.active) {
            color: #fff;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* ===== FORM CONTAINERS ===== */
        .form-container {
            display: none;
            animation: fade-in 0.3s ease;
        }
        .form-container.active {
            display: block;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label .required {
            color: var(--pink);
            font-size: 1rem;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            overflow: hidden;
        }
        .form-group .input-wrapper:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 30px var(--cyan-dim);
        }
        .form-group .input-wrapper .input-icon {
            padding: 0 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .form-group .input-wrapper input,
        .form-group .input-wrapper select {
            width: 100%;
            padding: 14px 14px 14px 0;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }
        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }
        .form-group .input-wrapper .toggle-password {
            padding: 0 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .form-group .input-wrapper .toggle-password:hover {
            color: var(--cyan);
        }

        .form-group .file-upload {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-glass);
            border: 1px dashed var(--border-glass);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .form-group .file-upload:hover {
            border-color: var(--cyan-dim);
            background: rgba(0, 240, 255, 0.03);
        }
        .form-group .file-upload .file-icon {
            font-size: 1.4rem;
            color: var(--cyan);
        }
        .form-group .file-upload .file-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .form-group .file-upload .file-text strong {
            color: var(--cyan);
        }
        .form-group .file-upload input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .form-group .file-upload .file-name {
            font-size: 0.8rem;
            color: var(--gold);
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 4px 0 2px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-glass);
        }
        .divider span {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ===== GMAIL BUTTON ===== */
        .btn-gmail {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .btn-gmail:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .btn-gmail i {
            font-size: 1.4rem;
            color: #ea4335;
        }
        .btn-gmail span {
            color: var(--text-secondary);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 14px 32px;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            box-shadow: 0 0 40px var(--cyan-dim);
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 60px var(--cyan-dim), 0 0 80px rgba(123, 47, 252, 0.15);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #f0a500);
            color: #0a0b1a;
            font-weight: 700;
            box-shadow: 0 0 40px var(--gold-dim);
        }
        .btn-gold:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 60px var(--gold-dim), 0 0 80px rgba(255, 215, 0, 0.1);
        }

        /* ===== AUTH FOOTER ===== */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: var(--cyan);
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
        }
        .auth-footer a:hover {
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold-dim);
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: var(--transition);
            margin-top: 16px;
            justify-content: center;
        }
        .back-home:hover {
            color: var(--cyan);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow);
            color: #fff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            min-width: 280px;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast .toast-icon {
            font-size: 1.4rem;
        }
        .toast .toast-icon.success {
            color: var(--green);
        }
        .toast .toast-icon.error {
            color: var(--red);
        }
        .toast .toast-icon.info {
            color: var(--cyan);
        }
        .toast .toast-close {
            margin-left: auto;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            background: none;
            border: none;
            font-size: 1.2rem;
        }
        .toast .toast-close:hover {
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .auth-card {
                padding: 28px 20px;
            }
            .name-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .auth-brand {
                font-size: 1.2rem;
            }
            .auth-brand .brand-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .auth-tab {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
            .toast {
                right: 12px;
                left: 12px;
                min-width: unset;
                font-size: 0.85rem;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== PARTICLES BACKGROUND ===== -->
    <canvas id="particles-canvas"></canvas>
    <div class="noise-overlay"></div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon"><i class="fas fa-check-circle"></i></span>
        <span id="toastMessage">Success!</span>
        <button class="toast-close" id="toastClose">&times;</button>
    </div>

    <!-- ===== AUTH WRAPPER ===== -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <span class="brand-icon"><i class="fas fa-coin"></i></span>
                    <span>DayCoin</span>
                </a>
                <!-- Tabs -->
                <div class="auth-tabs" id="authTabs">
                    <button class="auth-tab active" data-form="login">Login</button>
                    <button class="auth-tab" data-form="register">Register</button>
                </div>
                <p id="formSubtitle">Login to your account and start winning</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <div class="form-container active" id="loginFormContainer">
                <form class="auth-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="loginUsername"><i class="fas fa-user"></i> Username <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                            <input type="text" id="loginUsername" placeholder="Enter your username" required autocomplete="username" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                            <span class="toggle-password" data-target="loginPassword"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: -8px;">
                        <a href="#" style="color: var(--text-muted); font-size: 0.8rem; transition: var(--transition);" onmouseover="this.style.color='var(--cyan)'" onmouseout="this.style.color='var(--text-muted)'">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-gold">
                        <i class="fas fa-arrow-right"></i> Login
                    </button>
                    <div class="divider"><span>or continue with</span></div>
                    <button type="button" class="btn-gmail" id="gmailLogin">
                        <i class="fab fa-google"></i>
                        <span>Sign in with Google</span>
                    </button>
                </form>
            </div>

            <!-- ===== REGISTER FORM ===== -->
            <div class="form-container" id="registerFormContainer">
                <form class="auth-form" id="registerForm" novalidate>
                    <div class="name-row">
                        <div class="form-group">
                            <label for="regFirstName">First Name <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-user"></i></span>
                                <input type="text" id="regFirstName" placeholder="First" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="regLastName">Last Name <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-user"></i></span>
                                <input type="text" id="regLastName" placeholder="Last" required />
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPhone"><i class="fas fa-phone"></i> Phone Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-phone"></i></span>
                            <input type="tel" id="regPhone" placeholder="+1234567890" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail"><i class="fas fa-envelope"></i> Email <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> ID Upload <span class="required">*</span></label>
                        <div class="file-upload" id="idUpload">
                            <span class="file-icon"><i class="fas fa-cloud-upload-alt"></i></span>
                            <span class="file-text">Upload <strong>Passport</strong> / <strong>Driving Licence</strong> / <strong>ID Card</strong></span>
                            <input type="file" id="idFile" accept="image/*,.pdf" required />
                            <span class="file-name" id="fileName">No file chosen</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regUsername"><i class="fas fa-user-tag"></i> Username <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-user-tag"></i></span>
                            <input type="text" id="regUsername" placeholder="Choose a unique username" required autocomplete="username" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword"><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
                            <span class="toggle-password" data-target="regPassword"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>

                    <div class="divider"><span>or continue with</span></div>
                    <button type="button" class="btn-gmail" id="gmailRegister">
                        <i class="fab fa-google"></i>
                        <span>Sign up with Google</span>
                    </button>
                </form>
            </div>

            <!-- Footer (dynamic) -->
            <div class="auth-footer" id="authFooter">
                <span id="footerText">Don't have an account?</span>
                <a id="footerLink" data-switch="register">Register now</a>
            </div>

            <!-- Back to Home -->
            <a href="index.html" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

 
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ================================================================
        // 🔥 FIREBASE CONFIGURATION - REPLACE WITH YOUR OWN
        // ================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // 📝 REGISTRATION
        // ================================================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const fileInput = document.getElementById('idFile');

            if (!firstName || !lastName || !phone || !email || !username || !password) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }

            if (!fileInput.files || fileInput.files.length === 0) {
                showToast('Please upload a valid ID document.', 'error');
                return;
            }

            try {
                // 1. Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. Save user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    phone: phone,
                    email: email,
                    username: username,
                    walletBalance: 0,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    uid: user.uid
                });

                // 3. Create wallet document
                await db.collection('wallets').doc(user.uid).set({
                    balance: 0,
                    transactions: [],
                    status: 'Normal',
                    userId: user.uid
                });

                showToast('🎉 Account created! Please login.', 'success');
                setTimeout(() => {
                    switchForm('login');
                    document.getElementById('loginUsername').value = username;
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                showToast(error.message, 'error');
            }
        });

        // ================================================================
        // 🔐 LOGIN
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            try {
                // First, find user by username to get email
                const usersRef = db.collection('users');
                const snapshot = await usersRef.where('username', '==', username).get();

                if (snapshot.empty) {
                    showToast('User not found. Please check your username.', 'error');
                    return;
                }

                const userDoc = snapshot.docs[0];
                const userData = userDoc.data();
                const email = userData.email;

                // Sign in with email and password
                await auth.signInWithEmailAndPassword(email, password);
                
                // Check if user is approved
                if (userData.status === 'pending') {
                    showToast('⏳ Your account is pending admin approval.', 'info');
                    await auth.signOut();
                    return;
                }

                if (userData.status === 'suspended') {
                    showToast('🚫 Your account has been suspended. Contact admin.', 'error');
                    await auth.signOut();
                    return;
                }

                showToast('✅ Login successful! Redirecting...', 'success');
                
                // Store user data in session
                sessionStorage.setItem('userData', JSON.stringify({
                    uid: userDoc.id,
                    username: userData.username,
                    firstName: userData.firstName,
                    lastName: userData.lastName,
                    email: userData.email
                }));

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                showToast(error.message, 'error');
            }
        });

        // ================================================================
        // 🔑 GOOGLE SIGN-IN
        // ================================================================
        document.querySelectorAll('.btn-gmail').forEach(btn => {
            btn.addEventListener('click', async function() {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const user = result.user;

                    // Check if user exists in Firestore
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        // Create new user profile
                        await db.collection('users').doc(user.uid).set({
                            firstName: user.displayName?.split(' ')[0] || 'Google',
                            lastName: user.displayName?.split(' ')[1] || 'User',
                            phone: user.phoneNumber || '',
                            email: user.email,
                            username: user.displayName?.toLowerCase().replace(/\s/g, '') || 'google_user',
                            walletBalance: 0,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            uid: user.uid
                        });

                        await db.collection('wallets').doc(user.uid).set({
                            balance: 0,
                            transactions: [],
                            status: 'Normal',
                            userId: user.uid
                        });

                        showToast('🎉 Google account linked! Please wait for approval.', 'success');
                        await auth.signOut();
                    } else {
                        const data = userDoc.data();
                        if (data.status === 'pending') {
                            showToast('⏳ Your account is pending admin approval.', 'info');
                            await auth.signOut();
                            return;
                        }
                        if (data.status === 'suspended') {
                            showToast('🚫 Your account has been suspended.', 'error');
                            await auth.signOut();
                            return;
                        }
                        showToast('✅ Welcome back!', 'success');
                        sessionStorage.setItem('userData', JSON.stringify({
                            uid: user.uid,
                            username: data.username,
                            firstName: data.firstName,
                            lastName: data.lastName,
                            email: data.email
                        }));
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    }
                } catch (error) {
                    console.error('Google sign-in error:', error);
                    showToast(error.message, 'error');
                }
            });
        });

        // ================================================================
        // 📊 AUTH STATE LISTENER
        // ================================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('User is signed in:', user.uid);
            }
        });

        console.log('🔥 Firebase integrated successfully!');
    </script>
</body>
</html>
